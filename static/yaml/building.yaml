#-----------------------------------------------------------route
  /route/getOneRoute:
    post:
      tags:
      - "route"
      summary: ""
      description: "find path from start_point to end_point"
      operationId: "GET_ONE_ROUTE_POST_METHOD"
      requestBody:
        description: informations start_point , end_point
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/get_one_route_body'
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_one_route_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
    get:
      tags:
      - "route"
      summary: ""
      description: "find path from start_point to end_point"
      operationId: "GET_ONE_ROUTE_GET_METHOD"
      parameters:
        - in: query
          name: id 
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: startpoint 
          required: true
          schema:
            type: string
            example: "106.627545;10.854631;0.000000"
          description: start point ( string format "longitude;latitude;floor")
        - in: query
          name: endpoint 
          required: true
          schema:
            type: string
            example: "106.627280;10.854439;1.000000"
          description: start point ( string format "longitude;latitude;floor")
        - in: query
          name: weight 
          schema:
            type: number
            format: double
            example: 75.000000
          description: constraint weight
        - in: query
          name: height 
          schema:
            type: number
            format: double
            example: 1.5
          description: constraint height
        - in: query
          name: width 
          schema:
            type: number
            format: double
            example: 1.5
          description: constraint width
        - in: query
          name: elevator 
          schema:
            type: integer
            format: int
            example: 1
          description: constraint elevator
        - in: query
          name: stair 
          schema:
            type: integer
            format: int
            example: 0
          description: constraint stair
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_one_route_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /route/getMoreRoute:
    get:
      tags:
      - "route"
      summary: ""
      description: "find path from one point to more points or or vice versa"
      operationId: "GET_MORE_ROUTE"
      parameters:
        - in: query
          name: id 
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: coordinates
          description: "list coordinates of start_point and end_point. format every object {longitude;latitude;floor} and they are seperated by ',' "
          required: true
          schema:
            type: string
            example: "{106.627545;10.854396;0.000000},{106.627242;10.854471;0.000000},{106.627586;10.854471;2.000000},{106.627554;10.854424;5.000000},{106.627215;10.854471;5.000000}"
        - in: query
          name: "sources"
          description: "list id in list coordinates of start_point. sources_size is fewer than coordinates_size "
          required: true
          schema:
            type: string
            example: "0,1,2,3,5"
        - in: query
          name: "destinates"
          description: "list id in list coordinates of end_point. destinates_size is fewer than coordinates_size"
          required: true
          schema:
            type: string
            example: "5"
        - in: query
          name: weight 
          schema:
            type: number
            format: double
            example: 75.000000
          description: constraint weight
        - in: query
          name: height 
          schema:
            type: number
            format: double
            example: 1.5
          description: constraint height
        - in: query
          name: width 
          schema:
            type: number
            format: double
            example: 1.5
          description: constraint width
        - in: query
          name: elevator 
          schema:
            type: integer
            format: int
            example: 1
          description: constraint elevator
        - in: query
          name: stair 
          schema:
            type: integer
            format: int
            example: 0
          description: constraint stair
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_more_route_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
