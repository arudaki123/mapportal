########################################################################## 
components:
  schemas:
  #================================================================define
    #---------------------------poi--------------------------------
    general_poi:
      type: object
      properties:
        level:
          type: number
          format: double
          example: 1
        buildingid:
          type: string
          format: uuid
          example: e01ed528-a32f-46e2-a450-893d30aeb83b
        name:
          type: "string"
          example: "kfc"
        latitude:
          type: "number"
          example: "10.51245667"
          format: "double"
        longitude:
          type: "number"
          example: "106.51214124"
          format: "double"
        categoryname:
          type: "string"
          example: "fastfood"
    particular_poi:
      type: object
      description: "describing some fields of category mapping categoryname in general poi"
      properties:
        amenity:
          type: "string"
          example: "good"
        opening_time:
          type: "string"
          example: "12:59:59"
        closing_time:
          type: "string"
          example: "12:59:59"
        idstream:
          type: "string"
          example: T4.CauThang
        wifiname:
          type: "string"
          example: VBDwifi
        status:
          type: "string"
          example: good
    information_poi:
      allOf:
       - $ref: '#/components/schemas/general_poi'
       - $ref: '#/components/schemas/particular_poi'
      type: object
    poi:
      type: "object"
      properties:
        general:
          allOf:
            - $ref: '#/components/schemas/general_poi'
          type: object
          properties:
             id: 
              type: integer 
              format: int
              example: 0
        particular:
          allOf:
            - $ref: '#/components/schemas/particular_poi'
    #---------------------------beacon-----------------------------
    coordinate:
      type: object
      properties:
        longitude:
          type: number
          format: double
          example: 106.133
        latitude:
          type: number
          format: double
          example: 106.133
    information_beacon:
      type: object
      properties:
        uuid:
          type: string
          example: Redminote8
        mac:
          type: string
          example: EW80ECCACD
        name:
          type: string
          example: Rbeacon
        major:
          type: integer
          format: int
          example: -1
        minor:
          type: integer
          format: int
          example: -1
        firmware_a_version:
          type: string
          example: fi a
        firmware_b_version:
          type: string
          example: fi b
        ap_mac:
          type: string
          example: ap mac
        type:
          type: string
          example: type
        map_type:
          type: integer
          format: int
          example: 1
        location:
          $ref: '#/components/schemas/coordinate'
        elevation:
          type: integer
          format: int
          example: 1
        txpower:
          type: integer
          format: int
          example: -60
        height:
          type: "number"
          example: 4.5
          format: "double"
        direction:
          type: "number"
          example: 180.0
          format: "double"
    beacon:
      allOf:
       - $ref: '#/components/schemas/information_beacon'
      type: "object"
      properties:
        created_time: 
          type: string 
          example: "2022-08-11T15:26:40-07:00"
        modified_time:
          type: string 
          example: "2022-08-11T15:26:40-07:00"
    #---------------------------log_beacon-------------------------
    information_log_beacon:
      type: object
      properties:
        uuid:
          type: string
          example: Redminote8
        mac:
          type: string
          example: EW80ECCACD
        name:
          type: string
          example: Rbeacon
        major:
          type: integer
          format: int
          example: -1
        minor:
          type: integer
          format: int
          example: -1
        rssi:
          type: integer
          format: int
          example: 1
        connected_time:
          type: string
          example: 2022-04-19T10:10:07+07:00
    #---------------------------route-------------------------
    node_def:
      type: "object"
      properties:
        name:
          type: string
          example: elevator one
        latitude:
          type: "number"
          example: "10.5"
          format: "double"
        longitude:
          type: "number"
          example: "106.5"
          format: "double"
        floor:
          type: "integer"
          example: "1"
          format: "int"
        ntype: 
          type: integer
          format: int
          example: 1 
          description: "is node's type( 0 : NONE, 1: IOPOINT, 2:  STAIR, 3: ELEVATOR, 4: CLICK, 5: POI)"
    route_def:
      type: "object"
      properties:
        direction:
          type: "integer"
          format: "int32"
        length:
          type: "number"
          example: "10.5"
          format: "double"
        floor:
          type: "integer"
          format: "int32"
    
    position_def:
      type: "object"
      properties:
        location:
          type: "array"
          items:
            type: number
            format: double
          minItems: 2
          maxItems: 2
        name:
          type: "string"
          example: "KFC"
        floor:
          type: "integer"
          example: "1"
          format: "int"
    route_N_N_def:
      type: "object"
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/position_def"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/position_def"
        durations:
          type: array
          description: durations_size = max(sources_size,destinations_size) - 1
          items:
            type: number 
            format: double
        distances:
          type: array
          description: distances_size = max(sources_size,destinations_size) - 1
          items:
            type: number 
            format: double
        
    sub_constraint:
      type: object
      properties:
        id: 
          type: integer 
          format: int
          example: 0
        info:
          type: object
          properties:
            weight:
              type: number
              format: double
              example: 1000
            height:
              type: number
              format: double
              example: 3
            width:
              type: number
              format: double
              example: 3
    information_constraint:
      allOf:
        - $ref: '#/components/schemas/sub_constraint'
      type: object
      properties: 
        building:
          type: string 
          example: 4ec5df06-3838-420c-8a7b-959a5cf42206
        floorabove: 
          type: number 
          format: double
          example: 2
        floorblow: 
          type: number 
          format: double
          example: 1
        objectname:
          type: string 
          example: BOH16
        type:
          type: string 
          example: elevator
    constraint:
      allOf:
        - $ref: '#/components/schemas/information_constraint'
    #---------------------------floor-------------------------
    floordetail:
      type: object
      properties:
        name: 
          type: string 
          example: tang G
        number:
          type: integer
          format: int
          example : 0
  #================================================================request 
    #---------------------------poi--------------------------------
    add_poi_body:
      allOf:
       - $ref: '#/components/schemas/information_poi'
      type: "object"
    update_poi_body:
      allOf:
       - $ref: '#/components/schemas/information_poi'
      type: "object"
      properties:
        id: 
          type: integer 
          format: int
          example: 0
          description: id of poi
    add_update_category_body:
      type: "object"
      properties: 
        building:
          type: string
          format: uuid
          example: e01ed528-a32f-46e2-a450-893d30aeb83b
        category:
          type: array
          items:
            type: string
            example: bar
            minimum: 1
    #---------------------------beacon-----------------------------
    add_beacon_body:
      allOf:
       - $ref: '#/components/schemas/information_beacon'
    update_beacon_body:
      allOf:
       - $ref: '#/components/schemas/beacon'
    #---------------------------log_beacon-------------------------
    add_log_beacon_body:
      type: array
      description: list log beacon
      items:
        $ref: '#/components/schemas/information_log_beacon'
    #---------------------------route-------------------------
    get_one_route_body:
      type: "object"
      properties:
        id:
          type: "string"
          example: e01ed528-a32f-46e2-a450-893d30aeb83b
        start_floor:
          type: "number"
          example: 0
          format: "double"
        start_lat:
          type: "number"
          example: "10.5626"
          format: "double"
        start_lon:
          type: "number"
          example: "106.8634434"
          format: "double"
        end_floor:
          type: "number"
          example: 4.0
          format: "double"
        end_lat:
          type: "number"
          example: "10.5626"
          format: "double"
        end_lon:
          type: "number"
          example: "106.8634434"
          format: "double"
        options:
          type: "object"
          properties:
            weight: 
              type: "number"
              example: "1005.5"
              format: "double"
            height: 
              type: "number"
              example: "2.5"
              format: "double"
            width: 
              type: "number"
              example: "1.5"
              format: "double"
            elevator: 
              type: "boolean"
              format: "bool"
            stair: 
              type: "boolean"
              format: "bool"
    find_poi_around_body:
      type: "object"
      properties:
        id:
          type: "string"
          example: e01ed528-a32f-46e2-a450-893d30aeb83b
        current_lat:
          type: "number"
          example: "10.5626"
          format: "double"
        current_lon:
          type: "number"
          example: "106.8634434"
          format: "double"
        current_floor:
          type: "number"
          example: 4.0
          format: "double"
        options:
          type: "object"
          properties:
            distance: 
              type: "number"
              example: "999.5"
              format: "double"
            duration: 
              type: "number"
              example: "5"
              format: "double"
        categoryid:
          type: integer
          format: int
          example: 4
          
    add_update_constraint_body:
      type: array
      items:
        $ref: '#/components/schemas/sub_constraint'
    #---------------------------floor-------------------------
    add_update_floorname_body:
      type: array
      description: list log beacon
      items:
        $ref: '#/components/schemas/floordetail'
  #================================================================response
    #---------------------------code-------------------------------
    error_response:
      type: "object"
      properties:
        code:
          type: integer
          description: code of request
          example: 400
        message:
          type: string
          description: request status message
          example: cannot find value
        key:
          type: string
          description: invalid parameters in query or in body(not required)
          example: location
        key2:
          type: string
          description: invalid parameters in body(not required)
          example: longitude
    no_data_response:
      type: "object"
      properties:
        code:
          type: integer
          description: code of request(NOT_FOUND, OK, BAD_REQUEST, NOT_IMPLEMENT)
          example: 400
        message:
          type: string
          description: request status message(cannot find data, request successfully, request fail, request not implemented)
          example: request not implemented
    #---------------------------building---------------------------
    get_all_building_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: guid of building 
              example: 4ec5df06-3838-420c-8a7b-959a5cf42206
            category:
              type: array
              items:
                type: string
                example: bar
            pois:
              type: array
              items:
                $ref: '#/components/schemas/poi'
            beacons:
              type: array
              items:
                $ref: '#/components/schemas/beacon'
    get_building3d_building_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            building3ds:
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: guid of building 
                    example: b64b5478-1040-46ed-b421-e83596760d3c
                  name:
                    type: string
                    description: name of building 
                    example: vietbando
                  footprint:
                    type: string
                    description: footprint of building 
                    example: geometry format wkt string
                  created_time:
                    type: string
                    description: created time of building
                    example: "2022-04-19T03:10:07+07:00"
    get_id_building_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: guid of building 
              example: 4ec5df06-3838-420c-8a7b-959a5cf42206
    get_centroid_building_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            centroid:
              properties:
                longitude:
                  type: number
                  format: double
                  example: 106.62743970683072
                latitude:
                  type: number
                  format: double
                  example: 10.854468359393192
    get_footprint_building_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            footprint:
              description: list geometry in boundingbox
              items:
                type: object
                properties:
                  guid: 
                    type: string
                    example: e01ed528-a32f-46e2-a450-893d30aeb83b
                  check:
                    type: boolean
                    description: check data existing of this building 
                    example: true
                  type:
                    type: string
                    description: geometry type( multipolygon, multilline,..)
                    example: MultiPolygon
                  coordinates:
                    type: array
                    items:
                      type: array
                      description: array sub geomtry( polygon,..)
                      items:
                        type: array
                        description: array hole vs linearing
                        items:
                          type: array
                          items:
                            type: number
                            format: double
                          minItems: 2
                          maxItems: 2
    #---------------------------poi--------------------------------
    get_poi_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            pois:
              type: array
              items:
                $ref: '#/components/schemas/poi'
    get_category_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            category:
              type: array
              items:
                type: string
                example: bar
    add_poi_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            id:
              type: integer
              format: int 
              example: 0
    #---------------------------beacon-----------------------------
    get_beacon_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            beacons:
              type: array
              items:
                $ref: '#/components/schemas/beacon'
    #---------------------------log_beacon-------------------------
    add_log_beacon_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            building:
              type: string
              example: e01ed528-a32f-46e2-a450-893d30aeb83b
            floor:
              type: number 
              format: double
              example: 1.0
            coordinate:
              $ref: '#/components/schemas/coordinate'
            accuracy:
              type: number 
              format: double
              example: 100.0
    #---------------------------route-------------------------
    get_one_route_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            status:
              type: string
              description: finding path status ( OK , not found ). If status is "not found", route tag is not exist
              example: OK
            route:
              type: object
              properties:
                nodes:
                  type: array
                  items:
                    $ref: "#/components/schemas/node_def"
                paths:
                  type: array
                  items:
                    $ref: "#/components/schemas/route_def"
                checkMove:
                  type: integer
                  format: int
                  example: 2
                length:
                  type: number 
                  format: double
                  example: 57.9000001549720
    get_more_route_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            status:
              type: string
              description: finding path status ( OK , not found ). If status is "not found", some tags in route_N_N_def is not exist
              example: OK
          allOf:
            - $ref: "#/components/schemas/route_N_N_def"
    find_poi_around_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            status:
              type: string
              description: finding path status ( OK , not found ). If status is "not found", some tags in route_N_N_def is not exist
              example: OK
            sources:
              type: array
              description: sources_size = 1, it is mainly current_point 
              items:
                $ref: "#/components/schemas/position_def"
            destinations:
              type: array
              description: destinations_size is equal size of found pois
              items:
                $ref: "#/components/schemas/position_def"
            durations:
              type: array
              description: durations_size is equal size of found pois
              items:
                type: number 
                format: double
            distances:
              type: array
              description: distances_size is equal size of found pois
              items:
                type: number 
                format: double
    get_constraint_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            constraints:
              type: array
              items:
                $ref: '#/components/schemas/constraint'
    #---------------------------floor-------------------------
    get_floorname_response:
      type: object
      properties:
        code:
          type: integer
          description: code of request
          example: 200
        message:
          type: string
          description: request status message
          example: request successfully
        data:
          properties:
            floorname:
              type: array
              items:
                $ref: '#/components/schemas/floordetail'
