openapi: 3.0.0
info:
  title: "VBD Indoor Navigation API"
  description: "This is IndoorNavigation server. For this sample, you can use the api key `special-key` to test the authorization filters."
  version: "1.0.0"
  
  termsOfService: "http://IndoorNavigation.io/terms/"
  contact:
    email: "gr3@vietbando.vn"
  license:
    name: ""
    url: "https://api.vietbando.com/"
    
servers:
  - url: '{protocol}://{host}:{port}/indoors/v1'
    description: Optional server description, e.g. Internal staging server for testing
    variables:
      protocol:
        enum:
          - http
          - https
        default: http  
      host:
        enum:
          - 10.222.3.84
          - indoorapps.vietbando.vn
        default: 10.222.3.84  
      port:
        enum:
          - "18080"
          - "8083"
        default: "18080"

########################################################################## 
paths:
#-----------------------------------------------------------area
  /indoors/v1/area:
    get:
      tags:
      - area
      summary: AREA
      description: AREA
      operationId: area
      parameters:
        - name: buildingid
          in: query
          schema:
            type: string
            example: b64b5478-1040-46ed-b421-e83596760d3c
        - name: id
          in: query
          schema:
            type: string
            example: 0fb49b0b-e2e4-4c57-8f6d-489a73889cac
        - name: floorid
          in: query
          schema:
            type: string
            example: 0c57d027-d266-4344-b9b6-fc7c04729a49
      responses:
        '200':
          description: ''
    put:
      tags:
      - area
      summary: AREA
      description: AREA
      operationId: area3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bounding_box:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                      example: 106.66877566527457
                    example:
                      - 106.66877566527457
                      - 10.810845700675742
                  example:
                    - - 106.66877566527457
                      - 10.810845700675742
                    - - 106.66884972115128
                      - 10.810872873012372
                    - - 106.66891003308864
                      - 10.810715599882684
                    - - 106.66883697216788
                      - 10.810687029981407
                id:
                  type: string
                  example: 0fb49b0b-e2e4-4c57-8f6d-489a73889cac
                name:
                  type: string
                  example: F3T
            examples:
              AREA:
                value:
                  bounding_box:
                    - - 106.66877566527457
                      - 10.810845700675742
                    - - 106.66884972115128
                      - 10.810872873012372
                    - - 106.66891003308864
                      - 10.810715599882684
                    - - 106.66883697216788
                      - 10.810687029981407
                  id: 0fb49b0b-e2e4-4c57-8f6d-489a73889cac
                  name: F3T
      responses:
        '200':
          description: ''
    post:
      tags:
      - area
      summary: AREA
      description: AREA
      operationId: area2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bounding_box:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
                      example: 106.66877566527457
                    example:
                      - 106.66877566527457
                      - 10.810845700675742
                  example:
                    - - 106.66877566527457
                      - 10.810845700675742
                    - - 106.66884972115128
                      - 10.810872873012372
                    - - 106.66891003308864
                      - 10.810715599882684
                    - - 106.66883697216788
                      - 10.810687029981407
                floorid:
                  type: string
                  example: e0181d55-48e2-451c-a16b-1bd7a52e21de
                name:
                  type: string
                  example: F1QT
            examples:
              AREA:
                value:
                  bounding_box:
                    - - 106.66877566527457
                      - 10.810845700675742
                    - - 106.66884972115128
                      - 10.810872873012372
                    - - 106.66891003308864
                      - 10.810715599882684
                    - - 106.66883697216788
                      - 10.810687029981407
                  floorid: e0181d55-48e2-451c-a16b-1bd7a52e21de
                  name: F1QT
      responses:
        '200':
          description: ''
    delete:
      tags:
      - area
      summary: AREA
      description: AREA
      operationId: area1
      parameters:
        - name: buildingid
          in: query
          schema:
            type: string
            example: eeaca928-35d6-4711-ac49-c8b15d62d2b3
        - name: id
          in: query
          schema:
            type: string
            example: 6dbfab1e-3878-4f4c-93d0-efa89f30ca05
      responses:
        '200':
          description: ''
#-----------------------------------------------------------floor
  /indoors/v1/floor:
    get:
      tags:
      - floor
      summary: FLOOR
      description: FLOOR
      operationId: floor
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: cd32b4d0-5d57-47c4-814e-9fed58400840
        - name: buildingid
          in: query
          schema:
            type: string
            example: 4ec5df06-3838-420c-8a7b-959a5cf42206
      responses:
        '200':
          description: ''
    put:
      tags:
      - floor
      summary: FLOOR
      description: FLOOR
      operationId: floor2
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: ddbbbce0-047b-43b3-9c99-35d8304f6749
                  level:
                    type: number
                    example: -1
                  name:
                    type: string
                    example: B
              example:
                - id: ddbbbce0-047b-43b3-9c99-35d8304f6749
                  level: -1
                  name: B
                - id: 9e8f3c81-fc92-4e93-a5b4-e232ab181322
                  level: 0
                  name: G
                - id: 1b9fa6f6-6222-48ab-9932-a0d524740e9b
                  level: 1
                  name: '1'
                - id: cd32b4d0-5d57-47c4-814e-9fed58400840
                  level: 2
                  name: '2'
                - id: 283a6636-a8a1-417e-96cf-c6803badc7ce
                  level: 3
                  name: '3'
                - id: d6df8692-8265-4866-8c67-28446c17c300
                  level: 4
                  name: '4'
                - id: 68286dcc-eb73-4e9c-b874-3ef4ea849c52
                  level: 5
                  name: '5'
                - id: cb16859c-281d-4fdc-8ae4-29b5a050d7ff
                  level: 6
                  name: '6'
                - id: 0fde7e79-b344-4e6b-b0ed-8ee0558b3e7a
                  level: 7.5
                  name: '7.5'
            examples:
              FLOOR:
                value:
                  - id: ddbbbce0-047b-43b3-9c99-35d8304f6749
                    level: -1
                    name: B
                  - id: 9e8f3c81-fc92-4e93-a5b4-e232ab181322
                    level: 0
                    name: G
                  - id: 1b9fa6f6-6222-48ab-9932-a0d524740e9b
                    level: 1
                    name: '1'
                  - id: cd32b4d0-5d57-47c4-814e-9fed58400840
                    level: 2
                    name: '2'
                  - id: 283a6636-a8a1-417e-96cf-c6803badc7ce
                    level: 3
                    name: '3'
                  - id: d6df8692-8265-4866-8c67-28446c17c300
                    level: 4
                    name: '4'
                  - id: 68286dcc-eb73-4e9c-b874-3ef4ea849c52
                    level: 5
                    name: '5'
                  - id: cb16859c-281d-4fdc-8ae4-29b5a050d7ff
                    level: 6
                    name: '6'
                  - id: 0fde7e79-b344-4e6b-b0ed-8ee0558b3e7a
                    level: 7.5
                    name: '7.5'
      responses:
        '200':
          description: ''
    post:
      tags:
      - floor
      summary: FLOOR
      description: FLOOR
      operationId: floor1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buildingid:
                  type: string
                  example: 528d5baf-4a33-47fe-bdfc-442e3a5eddd6
                floor:
                  type: array
                  items:
                    type: object
                    properties:
                      level:
                        type: number
                        example: 7
                      name:
                        type: string
                        example: Tang7
                  example:
                    - level: 7
                      name: Tang7
            examples:
              FLOOR:
                value:
                  buildingid: 528d5baf-4a33-47fe-bdfc-442e3a5eddd6
                  floor:
                    - level: 7
                      name: Tang7
      responses:
        '200':
          description: ''
    delete:
      tags:
      - floor
      summary: FLOOR ( xóa từng tầng hoặc cả tòa )
      description: FLOOR ( xóa từng tầng hoặc cả tòa )
      operationId: floorXATNgTNgHoCCTA
      parameters:
        - name: buildingid
          in: query
          schema:
            type: string
            example: eeaca928-35d6-4711-ac49-c8b15d62d2b3
        - name: id
          in: query
          schema:
            type: string
            example: c2f8831f-4559-493f-b893-e4e90807ce02
      responses:
        '200':
          description: ''
#-----------------------------------------------------------building
  /buildings:
    post:
      tags:
      - building
      summary: ""
      description: "add or edit file( layer, network, floor) of building or add building's footprint "
      operationId: "INIT_UPDATE_BUILDING"
      parameters:
        - in: query
          name: id 
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                key:  
                  type: array
                  description: type of file ( network, layer, floor); if id param is null, key must only have one element and key's value can be null
                  items:
                    type: string
                    example: network
                  minItems: 1
                  maxItems: 3
                file:
                  type: array
                  description: File ( network.pbf, layer.pbf, floor.geojson). File order and file size must map with key order and key size. If id param is null, file type must be geojson.
                  items:
                    type: string
                    format: binary
                  minItems: 1
                  maxItems: 3
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
    delete:
      tags:
      - building
      summary: ""
      description: "delete all attributes of building"
      operationId: "DELETE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
          
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/all:
    get:
      tags:
      - building
      summary: ""
      description: "return guid, pois, beacons, categories of building"
      operationId: "GET_ALL"
      parameters:
        - in: query
          name: longitude   
          required: true
          schema:
            type: number
            format: double
            example: 106.721693
          description: longitude of building
        
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            format: double
            example: 10.794767
          description: latitude of building
          
        - in: query
          name: offset 
          schema:
            type: integer
            format: int
            example: -25200
          description: offset of timestamptz
          
      responses:
        '200':
          description: return all info of building 
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_all_building_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/building3d:
    get:
      tags:
      - building
      summary: ""
      description: "return information building ( guid , name , created time of input limited rows)"
      operationId: "GET_BUILDING3D"
      parameters:
        - in: query
          name: limit_row   
          required: true
          schema:
            type: integer
            format: int
          description: numbers of returning row
        
        - in: query
          name: offset
          schema:
            type: integer
            format: int
          description: offset of timestampt showing format
      responses:
        '200':
          description: A list of building 
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_building3d_building_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/id:
    get:
      tags:
      - building
      summary: ""
      description: "return guid of building"
      operationId: "GET_GUID"
      parameters:
        - in: query
          name: longitude   
          required: true
          schema:
            type: number
            format: double
            example: 106.721693
          description: longitude of building
        
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            format: double
            example: 10.794767
          description: latitude of building
      responses:
        '200':
          description: return guid of building 
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_id_building_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/centroid:
    get:
      tags:
      - building
      summary: ""
      description: "return coordinate of building"
      operationId: "GET_CENTROID"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        
      responses:
        '200':
          description: return guid of building 
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_centroid_building_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/footprint:
    get:
      tags:
      - building
      summary: ""
      description: "return list footprint in boundingbox"
      operationId: "GET_FOOTPRINT"
      parameters:
        - in: query
          name: minlon   
          required: true
          schema:
            type: number
            format: double
            example: 106.62613391876221
          description: min longitude of boundingbox
        - in: query
          name: minlat   
          required: true
          schema:
            type: number
            format: double
            example: 10.854957392324346
          description: min latitude of boundingbox
        - in: query
          name: maxlon   
          required: true
          schema:
            type: number
            format: double
            example: 106.63075268268585
          description: max longitude of boundingbox
        - in: query
          name: maxlat   
          required: true
          schema:
            type: number
            format: double
            example: 10.852818400932803
          description: max latitude in boundingbox
        
      responses:
        '200':
          description: return footprint of building 
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/get_footprint_building_response'
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/floor:
    get:
      tags:
      - building
      summary: ""
      description: "return buffer( floor ) of building"
      operationId: "GET_FLOOR_FILE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: extension   
          schema:
            type: string
            example: pbf
          description: returning type extension(pbf, geojson), if this param is invalid or null, default extension is geojson
          
      responses:
        '200':
          description: return buffer(floor) of building
          content:
            application/octetstream:
              schema:
                description: A geojson file (have Content-Disposition:attachment;filename="building.web.geojson" ) 
                type: string
                example: a json string( with geojson file) or a binary string ( with pbf file )
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
    delete:
      tags:
      - building
      summary: ""
      description: "delete files floor of building"
      operationId: "DELETE_FLOOR_FILE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
          
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
  /buildings/building:
    get:
      tags:
      - building
      summary: ""
      description: "return buffer( network , layer ) of building"
      operationId: "GET_BUFFER_FILE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
          
      responses:
        '200':
          description: return buffer file of building
          content:
            application/octetstream:
              schema:
                description: A zip file ( include file network and file layer; have Content-Disposition:attachment;filename="guid.zip" ) 
                type: string
                format: binary
                example: a binary string 
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
    delete:
      tags:
      - building
      summary: ""
      description: "delete file buffer( layer & network ) of building"
      operationId: "DELETE_BUFFER_FILE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
          
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
#-----------------------------------------------------------editor  
  /buildings/editor:
    post:
      tags:
      - editor
      summary: ""
      description: "add or edit file( osm , json) in editor folder"
      operationId: "ADD_EDITOR_FILE_BUILDING"
      parameters:
        - in: query
          name: id 
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: doctype   
          schema:
            type: string
            example: project
          description: type of file ( = project if returning json file ; = osm if returning osm file; not required if returning zip file( include all files in editor) )
        
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                key:  
                  type: array
                  description: Key's value can be null. If doctype is not null, key must only have one element
                  items:
                    type: string
                    example: empty
                  minItems: 1
                  maxItems: 2
                file:
                  type: array
                  description: file ( osm , json).file size must map with key size.
                  items:
                    type: string
                    format: binary
                  minItems: 1
                  maxItems: 2
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/no_data_response'
                  - $ref: '#/components/schemas/error_response'
    get:
      tags:
      - editor
      summary: ""
      description: "return one file or all files in editor folder of DB"
      operationId: "GET_EDITOR_FILE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: doctype   
          schema:
            type: string
            example: project
          description: type of file ( = project if returning json file ; = osm if returning osm file; not required if returning zip file( include all file in editor) )
          
      responses:
        '200':
          description: return editor files
          content:
            application/octetstream:
              schema:
                description: A zip file ( include osm file and json file; have Content-Disposition:attachment;filename="guid.zip" ), a osm file or a json file( both of them have filename format building.editor.{extension})
                type: string
                format: binary
                example: a binary string 
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
    delete:
      tags:
      - editor
      summary: ""
      description: "delete file buffer( layer & network ) of building"
      operationId: "DELETE_EDITOR_FILE_BUILDING"
      parameters:
        - in: query
          name: id   
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: doctype   
          schema:
            type: string
            example: project
          description: type of file ( = project if deleting json file ; = osm if deleting osm file; not required if deleting all files in editor )
          
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error_response'
                  - $ref: '#/components/schemas/no_data_response'
#-----------------------------------------------------------editor/floors 
  /buildings/editor/floors:
    post:
      tags:
      - editor/floors
      summary: ""
      description: "add or update file( jpg, png, bmp) in editor/floor"
      operationId: "ADD_EDITOR_FLOORS_FILE_BUILDING"
      parameters:
        - in: query
          name: id 
          required: true
          schema:
            type: string
            format: uuid
            example: e01ed528-a32f-46e2-a450-893d30aeb83b
          description: guid of building
        - in: query
          name: level   
          required: true
          schema:
            type: number
            format: double
            example: 1.0
          description: level in building
        
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                key:  
                  type: string
                  description: Key's value can be null. 
                  example: empty
                file:
                  type: string
                  description: file image ( jpg, png, bmp)
                  format: binary
      responses:
        '200':
          description: return request status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/no_data_response'
                  - $ref: '#/components/schemas/error_response'
    get:
      tags:
