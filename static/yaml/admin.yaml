    post:
      tags:
        - ROLE
      summary: CREAT/UPDATE ROLE
      description: CREAT/UPDATE ROLE
      operationId: creatUpdateRole
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: minio_user
                rank:
                  type: string
                  example: '00'
            examples:
              CREAT/UPDATE ROLE:
                value:
                  name: minio_user
                  rank: '00'
      responses:
        '200':
