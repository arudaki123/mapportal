        - apiKey: []
    delete:
      tags:
        - RBAC
      summary: RBAC
      description: RBAC
      operationId: rbac1
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: 9116302c-8cb4-43da-b11f-82b8f7a77828
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
  /admin/v1/api:
    get:
      tags:
        - API
      summary: API
      description: API
      operationId: api
      parameters:
        - name: productid
          in: query
          schema:
            type: string
            example: 00f57f48-c918-4939-97b0-0b3590e5e8f8
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    put:
      tags:
        - API
      summary: UPDATE API
      description: UPDATE API
      operationId: updateApi
      parameters:
        - name: productid
          in: query
          schema:
            type: string
            example: 00f57f48-c918-4939-97b0-0b3590e5e8f8
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attribute:
                  type: string
                  example: '[]'
                id:
                  type: string
                  example: 64af45ad-e80b-4a3a-9636-5aaedcf3034d
                method:
                  type: string
                  example: PUT
                resource:
                  type: string
                  example: test
                root:
                  type: string
                  example: test update
                sub_resource:
                  type: string
                  example: default
                version:
                  type: string
                  example: v1
            examples:
              UPDATE API:
                value:
                  attribute: '[]'
                  id: 64af45ad-e80b-4a3a-9636-5aaedcf3034d
                  method: PUT
                  resource: test
                  root: test update
                  sub_resource: default
                  version: v1
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    post:
      tags:
        - API
      summary: CREAT API
      description: CREAT API
      operationId: creatApi
      parameters:
        - name: productid
          in: query
          schema:
            type: string
            example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attribute:
                  type: string
                  example: ''
                method:
                  type: string
                  example: PUT
                resource:
                  type: string
                  example: registration
                root:
                  type: string
                  example: schedule
                sub_resource:
                  type: string
                  example: ''
                version:
                  type: string
                  example: v1
            examples:
              CREAT API:
                value:
                  attribute: ''
                  method: PUT
                  resource: registration
                  root: schedule
                  sub_resource: ''
                  version: v1
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    delete:
      tags:
        - API
      summary: API
      description: API
      operationId: api1
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: b7ae555a-d1a5-4bb9-bcbc-d97e8eb5ae19
        - name: productid
          in: query
          schema:
            type: string
            example: 00f57f48-c918-4939-97b0-0b3590e5e8f8
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
  /admin/v1/resource:
    get:
      tags:
        - RESOURCE
      summary: GET RESOURCE
      description: GET RESOURCE
      operationId: getResource
      parameters:
        - name: rscname
          in: query
          schema:
            type: string
            example: building
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    post:
      tags:
        - RESOURCE
      summary: POST RESOURCE
      description: POST RESOURCE
      operationId: postResource
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auid:
                  type: string
                  example: buildingmanagerid
                belongid:
                  type: string
                  example: buildingid
                belongname:
                  type: string
                  example: building
                rscid:
                  type: string
                  example: poimanagerid
                rscname:
                  type: string
                  example: user
            examples:
              POST RESOURCE:
                value:
                  auid: buildingmanagerid
                  belongid: buildingid
                  belongname: building
                  rscid: poimanagerid
                  rscname: user
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: token
      in: header
tags:
  - name: AUTHORIZE
  - name: TMP AUTHORIZE
  - name: USER
  - name: ROLE
  - name: RBAC
  - name: API
