        - apiKey: []
    post:
      tags:
        - TMP AUTHORIZE
      summary: CREATE TMP AUTHO
      description: CREATE TMP AUTHO
      operationId: createTmpAutho
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buildingid:
                  type: string
                  example: ''
                productid:
                  type: string
                  example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
                roleid:
                  type: string
                  example: eb37ebb3-c886-4ed6-8c87-5d04f1a54f7a
                userid:
                  type: string
                  example: c22f41e6-9b31-4ba3-880e-9446a79f66e4
            examples:
              CREATE TMP AUTHO:
                value:
                  buildingid: ''
                  productid: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
                  roleid: eb37ebb3-c886-4ed6-8c87-5d04f1a54f7a
                  userid: c22f41e6-9b31-4ba3-880e-9446a79f66e4
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    delete:
      tags:
        - TMP AUTHORIZE
      summary: DELETE AUTHO
      description: DELETE AUTHO
      operationId: deleteAutho1
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: ''
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
  /admin/v1/user:
    get:
      tags:
        - USER
      summary: GET USER
      description: GET USER
      operationId: getUser
      parameters:
        - name: type
          in: query
          schema:
            type: string
            example: all
        - name: productid
          in: query
          schema:
            type: string
            example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    put:
      tags:
        - USER
      summary: UPDATE USER ORTHER
      description: UPDATE USER ORTHER
      operationId: updateUserOrther
      parameters:
        - name: productid
          in: query
          schema:
            type: string
            example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: b96f21ef-0854-4a9a-94b4-6994a8374d5c
                new_password:
                  type: string
                  example: oke
            examples:
              CHANGE PASSWORD:
                value:
                  id: b96f21ef-0854-4a9a-94b4-6994a8374d5c
                  new_password: oke
              UPDATE USER ORTHER:
                value:
                  address: test3
                  avatar: >-
                    iVBORw0KGgoAAAANSUhEUgAAAgAAAAIACAYAAAD0eNTAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAB7fSURBVHhe7d0tmF63mQbgssLCwsLAwEJDw0BDQ8NAwzDDQMNAw8LAQMNAw8DAwtJdPW2nOzuV50efpKOjc9/X9aDtesbx9+noSK9e
                  email: test3@gmail.com
                  id: a8edecef-25d2-4644-98c2-0d41e3b0cd86
                  name: test3
                  new_password: test
                  phone_number: '123'
                  user_name: test3
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    post:
      tags:
        - USER
      summary: REGISTER - INIT USER
      description: REGISTER - INIT USER
      operationId: registerInitUser
      parameters:
        - name: productid
          in: query
          schema:
            type: string
            example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                  example: QT park
                email:
                  type: string
                  example: minior@gmail.vn
                name:
                  type: string
                  example: Nguyễn Văn minior
                password:
                  type: string
                  example: minior
                phone_number:
                  type: string
                  example: '0123456789'
                productid:
                  type: string
                  example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
                user_name:
                  type: string
                  example: minior
            examples:
              REGISTER - INIT USER:
                value:
                  address: QT park
                  email: minior@gmail.vn
                  name: Nguyễn Văn minior
                  password: minior
                  phone_number: '0123456789'
                  productid: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
                  user_name: minior
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    delete:
      tags:
        - USER
      summary: DELETE USER
      description: DELETE USER
      operationId: deleteUser
      parameters:
        - name: user_name
          in: query
          schema:
            type: string
            example: test10
        - name: productid
          in: query
          schema:
            type: string
            example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
  /admin/v1/user/link:
    post:
      tags:
        - USER
      summary: LINK TO ORTHER PRODUCT
      description: LINK TO ORTHER PRODUCT
      operationId: linkToOrtherProduct
      parameters:
        - name: ''
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: admin
                productid:
                  type: string
                  example: 6e229822-92a9-4503-8b01-971fb5a0d3ec
                user_name:
                  type: string
                  example: admin
            examples:
              LINK TO ORTHER PRODUCT:
                value:
                  password: admin
                  productid: 6e229822-92a9-4503-8b01-971fb5a0d3ec
                  user_name: admin
