openapi: 3.0.3
info:
  title: ADMIN SERVER
  version: 1.0.0
  contact: {}
servers:
  - url: http://{{host}}
paths:
  /admin/v1/authorization:
    get:
      tags:
        - AUTHORIZE
      summary: GET ALL AUTHO
      description: GET ALL AUTHO
      operationId: getAllAutho
      parameters:
        - name: productid
          in: query
          schema:
            type: string
            example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    put:
      tags:
        - AUTHORIZE
      summary: UPDATE AUTHO
      description: UPDATE AUTHO
      operationId: updateAutho
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                info:
                  type: string
                  example: >-
                    {"camera": [{"camera_id": [875,882],"building":
                    "b64b5478-1040-46ed-b421-e83596760d3c"}]}
                role:
                  type: string
                  example: camera manager
                service:
                  type: string
                  example: IndoorNavigation
                user_name:
                  type: string
                  example: camera_manager
            examples:
              UPDATE AUTHO:
                value:
                  info: >-
                    {"camera": [{"camera_id": [875,882],"building":
                    "b64b5478-1040-46ed-b421-e83596760d3c"}]}
                  role: camera manager
                  service: IndoorNavigation
                  user_name: camera_manager
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    post:
      tags:
        - AUTHORIZE
      summary: CREATE AUTHO
      description: CREATE AUTHO
      operationId: createAutho
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                buildingid:
                  type: string
                  example: e01ed528-a32f-46e2-a450-893d30aeb83b
                productid:
                  type: string
                  example: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
                roleid:
                  type: string
                  example: 79431706-20c8-49ac-9078-fe658c64aedd
                userid:
                  type: string
                  example: 16a57632-d9c5-4d2e-847e-6e4a4e132de5
            examples:
              CREATE AUTHO:
                value:
                  buildingid: e01ed528-a32f-46e2-a450-893d30aeb83b
                  productid: 2fee2e3f-fe87-4429-8531-b58bc2660f0a
                  roleid: 79431706-20c8-49ac-9078-fe658c64aedd
                  userid: 16a57632-d9c5-4d2e-847e-6e4a4e132de5
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
    delete:
      tags:
        - AUTHORIZE
      summary: DELETE AUTHO
      description: DELETE AUTHO
      operationId: deleteAutho
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: ''
      responses:
        '200':
          description: ''
      security:
        - apiKey: []
  /admin/v1/authorization/permission:
    get:
      tags:
        - TMP AUTHORIZE
