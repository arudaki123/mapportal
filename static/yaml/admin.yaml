    put:
      tags:
        - TMP AUTHORIZE
      summary: UPDATE TMP AUTHO
      description: UPDATE TMP AUTHO
      operationId: updateTmpAutho
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  example: 32192820-3bec-4aa2-a548-f7475412e20f
                status:
                  type: string
